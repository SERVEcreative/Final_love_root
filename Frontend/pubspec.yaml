name: romantic_login_app
description: A romantic Flutter app with phone number login
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  intl_phone_field: ^3.2.0
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  google_mobile_ads: ^5.1.0
  pin_code_fields: ^8.0.1
  http: ^1.1.0
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  supabase_flutter: ^2.0.0
  flutter_webrtc: ^1.1.0
  permission_handler: ^12.0.0
  image_picker: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
